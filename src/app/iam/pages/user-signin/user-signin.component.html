<div class="rounded-box">
  <div class="right-side">
    <div class="form-container">
      <img src="../../../../assets/logoApp.png" alt="logoapp" class="logo">

      @if (errorMessage !== "") {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="form-field">
          <mat-label>Correo</mat-label>
          <input matInput formControlName="username">
          <mat-error *ngIf="signInForm.get('username')?.invalid && signInForm.get('username')?.touched">
            Correo es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field class="form-field">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="signInForm.get('password')?.invalid && signInForm.get('password')?.touched">
            Contraseña es requerida
          </mat-error>
        </mat-form-field>

        <button mat-raised-button class="login-button" type="submit">Iniciar sesión</button>
      </form>

      <p class="forgot-password" (click)="redirectToPasswordRecovery()">¿Olvidaste tu contraseña?</p>
      <a class="create-account" (click)="redirectToSignUp()">Crear cuenta</a>
    </div>
  </div>
</div>
