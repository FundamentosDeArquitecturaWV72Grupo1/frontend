<div class="score-display">
  <h2>Current Score: {{ currentScore }}</h2>
</div>

<div class="game-list">
  <mat-card *ngFor="let game of games" (click)="goToGameDetail(game.id)" class="game-card">
    <img mat-card-image [src]="game.image" alt="{{ game.title }}">
    <mat-card-content>
      <h3>{{ game.title }}</h3>
      <p>{{ game.topic }}</p>
      <button mat-icon-button (click)="toggleFavorite(game.id); $event.stopPropagation()">
        <mat-icon [ngClass]="{'favorite-icon': isFavorite(game.id), 'non-favorite-icon': !isFavorite(game.id)}">
          {{ isFavorite(game.id) ? 'favorite' : 'favorite_border' }}
        </mat-icon>
      </button>
    </mat-card-content>
  </mat-card>
</div>
