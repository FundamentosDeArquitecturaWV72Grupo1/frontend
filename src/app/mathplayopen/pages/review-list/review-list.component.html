<div *ngIf="reviews.length > 0; else noReviews" class="reviews-container">
  <div *ngFor="let review of reviews" class="review-card">
    <p><strong>Score:</strong> {{ review.score }} / 5</p>
    <p><strong>By:</strong> {{ review.userName }}</p>
    <p>{{ review.description }}</p>
  </div>
</div>

<ng-template #noReviews>
  <p>No reviews available for this game yet. Be the first to add one!</p>
</ng-template>
